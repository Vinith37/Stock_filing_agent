[project]
name = "stock-filing-agent"
version = "0.1.0"
description = "BSE/NSE Exchange Filings Analysis Agent with Phi-4 Mini + LangGraph"
requires-python = ">=3.11"

dependencies = [
    "langgraph>=0.2.0",
    "langchain-ollama>=0.2.0",
    "langchain-core>=0.3.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "openpyxl>=3.1.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "pdfplumber>=0.11.0",
    "python-dotenv>=1.0.0",
    "schedule>=1.2.0",
    "loguru>=0.7.0",
    "lxml>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5.0",
]
